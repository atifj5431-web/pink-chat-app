<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinkTalk 💗</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff5f8;
  color:#513744;
}
header{
  background:#ffb6cc;
  padding:22px;
  text-align:center;
  border-radius:0 0 25px 25px;
}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0}
.container{padding:18px;max-width:600px;margin:auto}
.card{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 5px 20px #f0cbd7;
}
.messages{
  height:48vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:12px 0;
}
.msg{
  background:#ffe3ec;
  padding:12px 15px;
  border-radius:17px 17px 17px 4px;
  max-width:85%;
  overflow-wrap:anywhere;
}
.msg.mine{
  background:#ffb6cc;
  align-self:flex-end;
  border-radius:17px 17px 4px 17px;
}
form{display:flex;gap:8px;margin-top:12px}
input{
  min-width:0;
  flex:1;
  border:1px solid #f3bfd0;
  border-radius:25px;
  padding:13px;
  outline:none;
}
button{
  border:0;
  border-radius:25px;
  padding:12px 17px;
  background:#f47da4;
  color:white;
  font-weight:bold;
}
#status{font-size:12px;color:#987786;text-align:center}
</style>
</head>
<body>
<header>
  <h1>💕 PinkTalk</h1>
  <p>A little place for lovely conversations</p>
</header>

<div class="container">
  <div class="card">
    <h3>💌 Our Chat Room</h3>
    <p id="status">Your little chat starts here 🌷</p>
    <div class="messages" id="messages">
      <div class="msg">Welcome to PinkTalk! 💗</div>
      <div class="msg">Send yourself a little message ✨</div>
    </div>
    <form id="chatForm">
      <input id="messageInput" placeholder="Write something sweet..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");

form.addEventListener("submit", function(event) {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  const bubble = document.createElement("div");
  bubble.className = "msg mine";
  bubble.textContent = text;
  messages.appendChild(bubble);
  input.value = "";
  messages.scrollTop = messages.scrollHeight;
});
</script>
</body>
</html>
